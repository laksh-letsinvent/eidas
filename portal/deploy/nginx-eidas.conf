# nginx vhost for eidas.letsinvent.co.uk
# Static export served from the portal's out/ directory.
# Mirrors the bio-authn / bio-idv pattern.

server {
    listen 80;
    listen [::]:80;
    server_name eidas.letsinvent.co.uk;

    # certbot will manage the TLS block; run:
    #   sudo certbot --nginx -d eidas.letsinvent.co.uk
    # after this file is in place and nginx -t passes.

    root /var/www/eidas/out;
    index index.html;

    # Next.js static export uses trailingSlash: true, so /atlas/ -> /atlas/index.html
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Long-cache the hashed static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache HTML
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
}
